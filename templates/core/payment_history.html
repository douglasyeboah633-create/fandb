{% load landpro_tags %}<div class="table-responsive"><table class="table"><thead><tr><th>Date</th><th>Amount</th><th>Method</th><th>Receipt</th></tr></thead><tbody>{% for payment in payments %}<tr><td><a href="{{ payment.get_absolute_url }}">{{ payment.payment_date }}</a></td><td>{{ payment.amount|money }}</td><td>{{ payment.get_payment_method_display }}</td><td><a href="{% url 'core:receipt_print' payment.pk %}">{{ payment.receipt_number }}</a></td></tr>{% empty %}<tr><td colspan="4">No payments recorded.</td></tr>{% endfor %}</tbody></table></div>
